name: Update Avantio availability calendar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download Avantio calendar
        run: |
          curl -L --fail \
            "https://calendar.avantio.pro/v1/3091b5a5-4d20-45b9-8faf-eb300bdbe4f8.ics" \
            -o data/availability.ics

      - name: Commit updated calendar if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/availability.ics
          git diff --cached --quiet || git commit -m "Update Avantio availability calendar"
          git push
